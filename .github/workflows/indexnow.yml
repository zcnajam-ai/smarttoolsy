name: IndexNow
on:
  push:
    branches: [main]
    paths: [docs/sitemap.xml]
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap
        type: boolean
        default: false
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit new URLs to IndexNow
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            python3 scripts/indexnow.py --all
          else
            python3 scripts/indexnow.py "${{ github.event.before || 'HEAD~1' }}"
          fi
